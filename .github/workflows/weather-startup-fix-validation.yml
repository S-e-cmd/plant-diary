name: Temporary weather startup fix validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.head_ref == 'maintenance/weather-startup-fix-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix saved draft selector when needed
        id: fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(savedDraft){$('[data-input-type]').forEach(b=>b.classList.toggle('active',b.dataset.inputType===state.inputType));"
          new="if(savedDraft){$$('[data-input-type]').forEach(b=>b.classList.toggle('active',b.dataset.inputType===state.inputType));"
          count=s.count(old)
          if count == 1:
              p.write_text(s.replace(old,new))
              Path('/tmp/changed').write_text('true')
          elif new in s:
              Path('/tmp/changed').write_text('false')
          else:
              raise SystemExit(f'expected saved-draft startup source once, got {count}')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"
      - name: Run unified regression tests
        run: npm test
      - name: Verify startup order and selector
        shell: bash
        run: |
          grep -Fq "await initializeWeatherRuntime()" index.html
          grep -Fq "if(savedDraft){\$\$('[data-input-type]').forEach" index.html
          grep -Fq "await bootstrap()" index.html
          git diff --check
      - name: Commit index fix only
        if: steps.fix.outputs.changed == 'true'
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix saved draft restoration after weather startup switch'
          git push origin HEAD:${{ github.head_ref }}
