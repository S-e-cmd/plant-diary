<html lang="ja">

<body>
<div class="app">

  <section class="pinned" id="pinned"><div class="pin-head"><div><div class="pin-title">作業・天気</div><div class="weather" id="weather"></div><div class="tomorrow-weather" id="tomorrowWeather"></div><div class="weather-alert" id="weatherAlert"></div><div class="work-window" id="workWindow"></div><div class="forecast-strip" id="weekForecast"></div></div><button class="pin-toggle" id="pinToggle"></button></div><div class="pin-row" id="pinRow"></div><div class="pin-title" style="margin-top:8px">今日のその他作業 <span id="overdue"></span></div><div class="pin-more" id="pinMore"></div></section>
  <main class="scroll">
    <section class="tab active" id="tab-today"><div id="todayList"></div></section>
    <section class="tab" id="tab-input"><div class="card quick-card"><div class="quick-head"><div class="pin-title">クイック入力</div><span class="draft-note">よく使う内容・最近の記録</span></div><div id="quickInputList"></div></div>
      <div class="card"><div class="seg"><button class="active" data-input-type="actual">実施</button><button data-input-type="plan">予定</button></div><label class="label">日付</label><input class="date" type="date" id="inputDate"><label class="label">作業内容</label><textarea id="rawText" placeholder="例：牡丹に水やり。西側を除草。次回は薬剤A、次々回は薬剤Bで消毒予定。"></textarea><div class="draft-note" id="draftNote">入力内容はこの端末に自動保存されます</div><button class="primary" id="analyzeBtn">入力内容を整理する</button></div>
      <div class="card preview" id="preview"><div class="entry-head"><b>この内容で登録</b><button class="secondary" id="addEntryBtn">＋追加</button></div><div id="previewList"></div><button class="primary" id="saveBtn">登録する</button></div>
    </section>
    <section class="tab" id="tab-logs"><div class="viewbar"><button class="active" data-view="day">日</button><button data-view="week">週</button><button data-view="month">月</button></div><div class="card search-card" id="searchCard" style="padding:10px"><button class="search-toggle" id="searchToggle">検索・絞り込み <span id="searchActiveCount"></span></button><label class="label" style="margin-top:0">検索</label><input id="logSearch" placeholder="植物・場所・作業・資材・薬剤・液肥"><div class="grid2"><div><label class="label">開始日</label><input type="date" id="searchStart"></div><div><label class="label">終了日</label><input type="date" id="searchEnd"></div></div><div class="filter-row"><select id="filterType"><option value="">実施・予定すべて</option><option value="actual">実施のみ</option><option value="plan">予定のみ</option></select><select id="filterStatus"><option value="">状態すべて</option><option value="未完了">未完了</option><option value="完了">完了</option><option value="中止">見送り</option></select><select id="filterCategory"><option value="">分類すべて</option></select><select id="filterSpecial"><option value="">内容すべて</option><option value="spray">消毒・薬剤</option><option value="liquid">液肥・活力</option></select></div><div class="saved-searches" id="savedSearches"></div><div class="search-save-row"><button id="saveSearchBtn">現在の検索条件を保存</button></div><div class="grid2"><button class="secondary csv-btn" id="csvBtn">表示中をCSV出力</button><button class="secondary csv-btn" id="searchClear">検索を解除</button></div></div><div class="grid2" style="margin-bottom:8px"><button class="secondary" id="analysisBtn">履歴分析</button><button class="secondary" id="usageBtn">資材・薬剤の使用履歴</button></div><button class="secondary" id="trashBtn" style="width:100%;margin-bottom:8px">削除済みの記録</button><div class="period"><button id="prevPeriod">‹</button><b id="periodLabel"></b><button id="nextPeriod">›</button></div><div class="log-tools"><span id="logCount"></span><select id="logSort"><option value="desc">新しい順</option><option value="asc">古い順</option></select></div><div id="summaryCard"></div><div id="logsList"></div><div class="pager" id="logPager"></div></section>
    <section class="tab" id="tab-plans"><div class="viewbar" id="planFilters"><button class="active" data-plan-filter="pending">未完了</button><button data-plan-filter="overdue">期限超過</button><button data-plan-filter="undated">日付未定</button><button data-plan-filter="done">完了</button><button data-plan-filter="cancelled">見送り</button></div><button class="secondary" id="selectPlansBtn" style="width:100%;margin-bottom:9px">予定を選択して一括操作</button><div class="selectionbar" id="selectionBar"><div class="selectionbar-top"><span id="selectionCount">0件選択</span><button id="selectAllBtn">すべて選択</button></div><div class="selection-actions"><button id="selectedComplete">完了扱い</button><button id="selectedPostpone">延期</button><button id="selectedCancel">見送り</button></div></div><div class="bulkbar" id="overdueBulk"><span id="overdueBulkText"></span><button id="completeOverdueBtn">一括で完了扱い</button></div><button class="secondary" id="calendarAllBtn" style="width:100%;margin-bottom:10px">未登録の予定をカレンダーへ一括登録</button><div id="plansList"></div></section>
  </main>
  <nav class="nav"><button class="active" data-tab="today"><span>✓</span>今日</button><button data-tab="input"><span>✎</span>入力</button><button data-tab="logs"><span>☷</span>ログ</button><button data-tab="plans"><span>▣</span>予定</button></nav>
</div>
<div class="toast" id="toast"></div>
<div class="processing" id="processing" aria-live="polite" aria-busy="true"><div class="processing-box"><span class="spinner"></span><span id="processingText">処理中…</span></div></div>
<div class="overlay" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">編集</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script>
const API_URL='/api';
const savedCollapsed=JSON.parse(localStorage.getItem('plantDiaryCollapsed')||'{}');
const savedQuickFavorites=JSON.parse(localStorage.getItem('plantDiaryQuickFavorites')||'[]');
const savedDraft=JSON.parse(localStorage.getItem('plantDiaryInputDraft')||'null');
const savedSearches=JSON.parse(localStorage.getItem('plantDiarySavedSearches')||'[]');
const state={inputType:savedDraft?.inputType||'actual',entries:savedDraft?.entries||[],actuals:[],plans:[],trash:[],pinned:{},summaries:{daily:[],weekly:[],monthly:[]},weather:null,forecasts:[],forecastHourly:[],weatherRules:{spray:{rain:0.5,rainProbability:40,wind:5},liquid:{rain:0.5,rainProbability:40,wind:5}},masters:{},spreadsheetUrl:'',view:'day',cursor:new Date(),planFilter:'pending',search:{q:'',start:'',end:'',type:'',status:'',category:'',special:''},completingPlanId:'',rotationExpanded:false,busy:false,collapsed:savedCollapsed,selectionMode:false,selectedPlans:new Set(),visibleLogs:[],quickFavorites:savedQuickFavorites,quickMap:new Map(),logPage:1,logPageSize:20,logSort:'desc',outlookDays:7,expandedLogs:new Set(),savedSearches,intervalRules:[],analysis:null,settingsLoaded:false};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=s=>s?new Date(`${s}T12:00:00`).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}):'日付未定';
$('#inputDate').value=savedDraft?.date||localDate(new Date());
$('#rawText').value=savedDraft?.rawText||'';
async function api(payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j;try{j=await r.json()}catch(e){throw new Error('APIから正しい応答が返りませんでした。')}if(!r.ok||!j.ok)throw new Error(j.error||'通信に失敗しました。');return j.data}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function busy(v,label){state.busy=v;$('#analyzeBtn').disabled=v;$('#saveBtn').disabled=v;$('#syncBtn').disabled=v;$('#processing').classList.toggle('show',v);if(v)$('#processingText').textContent=label||'処理中…'}
async function bootstrap(){busy(true);try{const d=await api({action:'bootstrap'});state.forecasts=Array.isArray(d.forecasts)&&d.forecasts.length?d.forecasts:await fetchForecastsDirect();applyBootstrap(d);toast('更新しました');}catch(e){toast(e.message)}finally{busy(false)}}
async function fetchForecastsDirect(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=35.7156&longitude=139.7730&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FTokyo&wind_speed_unit=ms&forecast_days=7',r=await fetch(url),j=await r.json(),d=j.daily||{};return(d.time||[]).map((date,i)=>({date,code:Number(d.weather_code?.[i]),maxTemp:d.temperature_2m_max?.[i],minTemp:d.temperature_2m_min?.[i],rain:d.precipitation_sum?.[i],rainProbability:d.precipitation_probability_max?.[i],maxWind:d.wind_speed_10m_max?.[i],source:'browser-api'}))}catch(e){return[]}}
let forecastWeatherName,weatherRule,forecastRain,forecastStrongWind,weatherWorkRisk,riskReason,isWeatherSensitivePlan,planWeatherKind,safeWindows,downloadBrowserBlob,logRuntime,quickInputRuntime,rotationRuntime,buildBulkPlanRequest;
async function initializeWeatherRuntime(){const {createWeatherRuntime}=await import('./client/weather-runtime.js');({forecastWeatherName,weatherRule,forecastRain,forecastStrongWind,weatherWorkRisk,riskReason,isWeatherSensitivePlan,planWeatherKind,safeWindows}=createWeatherRuntime(()=>state))}
async function initializeDownloadRuntime(){({downloadBrowserBlob}=await import('./client/download-utils.js'))}
async function initializeClientRuntimes(){const[{createLogRuntime},{createQuickInputRuntime},{createRotationRuntime},bulk]=await Promise.all([import('./client/log-runtime.js'),import('./client/quick-input-runtime.js'),import('./client/rotation-runtime.js'),import('./client/plan-bulk-utils.js')]);logRuntime=createLogRuntime(()=>state,()=>localDate(new Date()));quickInputRuntime=createQuickInputRuntime(()=>state);rotationRuntime=createRotationRuntime(()=>state);buildBulkPlanRequest=bulk.buildBulkPlanRequest}
function renderWorkWindows(){const today=localDate(new Date()),tomorrow=localDate(new Date(Date.now()+86400000)),line=(date,label,extra)=>`<div class="${extra?'window-extra':''}"><b>${label}</b>　消毒 ${safeWindows(date,'spray')}／液肥 ${safeWindows(date,'liquid')}</div>`;$('#workWindow').innerHTML=state.forecastHourly.length?line(today,'今日',false)+line(tomorrow,'明日',true):'時間別予報を取得できませんでした'}
function renderForecasts(){const f=state.forecasts[1],el=$('#tomorrowWeather');if(!f){el.textContent='明日の予報を取得できませんでした';el.classList.remove('rain');$('#weekForecast').innerHTML='';return}const rainText=f.rainProbability==null&&f.rain==null?'':`　降水 ${f.rainProbability??'—'}％・${f.rain??'—'}mm`,windText=f.maxWind==null?'':`　風 ${Number(f.maxWind).toFixed(1)}m/s`;el.textContent=`明日：${forecastWeatherName(f)}　最高 ${f.maxTemp??'—'}℃／最低 ${f.minTemp??'—'}℃${rainText}${windText}`;el.classList.toggle('rain',weatherWorkRisk(f));$('#weekForecast').innerHTML=state.forecasts.slice(1).map((x,i)=>`<div class="forecast-chip ${weatherWorkRisk(x)?'rain':''}"><b>${i===0?'明日':fmtDate(x.date)}</b>${esc(forecastWeatherName(x))}<br>${x.maxTemp??'—'}℃${x.maxWind==null?'':`・風${Number(x.maxWind).toFixed(1)}`}</div>`).join('');const alerts=[];if(weatherWorkRisk(f))alerts.push(`明日は${riskReason(f)}予報です。消毒・液肥は見送りを検討`);const byDate=new Map(state.forecasts.map(x=>[x.date,x])),risky=state.plans.filter(x=>x.status!=='完了'&&x.status!=='中止'&&isWeatherSensitivePlan(x)).filter(x=>{const d=x.date||x.startDate;return weatherWorkRisk(byDate.get(d),planWeatherKind(x))}).slice(0,2);risky.forEach(x=>{const d=x.date||x.startDate,k=planWeatherKind(x);alerts.push(`${fmtDate(d)}「${x.action}」は${riskReason(byDate.get(d),k)}予報`)});$('#weatherAlert').textContent=[$('#weatherAlert').textContent,...alerts].filter(Boolean).join('／')}
function activeTab(){return $('.nav [data-tab].active')?.dataset.tab||'today'}
function renderActiveTab(){const tab=activeTab();if(tab==='today'){renderOutlook();renderToday()}else if(tab==='input'){renderQuickInputs();if(state.entries.length)renderPreview()}else if(tab==='logs'){fillLogFilters();renderSavedSearches();renderLogs()}else if(tab==='plans')renderPlans()}
function applyBootstrap(d){state.actuals=d.actuals||[];state.plans=d.plans||[];state.trash=d.trash||[];state.pinned=d.pinned||{};state.summaries=d.summaries||{daily:[],weekly:[],monthly:[]};state.weather=d.weather;state.forecastHourly=d.forecastHourly||[];state.masters=d.masters||{};state.spreadsheetUrl=d.spreadsheetUrl||'';state.intervalRules=d.intervalRules||[];state.analysis=d.analysis||null;if(!state.settingsLoaded){const s=d.appSettings||{},needsUpload=!Object.keys(s).length;if(Array.isArray(s.quickFavorites)&&s.quickFavorites.length)state.quickFavorites=s.quickFavorites;if(Array.isArray(s.savedSearches)&&s.savedSearches.length)state.savedSearches=s.savedSearches;if(s.weatherRules)state.weatherRules={...state.weatherRules,...s.weatherRules};if(s.ui){state.outlookDays=Number(s.ui.outlookDays)||7;state.logSort=s.ui.logSort||'desc';$('#logSort').value=state.logSort}state.settingsLoaded=true;if(needsUpload)syncAppSettings()}state.selectedPlans=new Set([...state.selectedPlans].filter(id=>state.plans.some(x=>x.id===id)));renderPinned();renderForecasts();renderWorkWindows();renderActiveTab()}
function fillLogFilters(){const el=$('#filterCategory'),value=el.value,cats=[...new Set([...state.actuals,...state.plans].map(x=>x.category).filter(Boolean))].sort();el.innerHTML='<option value="">分類すべて</option>'+cats.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function quickKey(x){return quickInputRuntime.quickKey(x)}
function quickTemplate(x){return quickInputRuntime.quickTemplate(x)}
function isFavorite(x){return quickInputRuntime.isFavorite(x)}
function saveQuickFavorites(){localStorage.setItem('plantDiaryQuickFavorites',JSON.stringify(state.quickFavorites));syncAppSettings()}
function syncAppSettings(){if(!state.settingsLoaded)return;clearTimeout(syncAppSettings.timer);syncAppSettings.timer=setTimeout(()=>api({action:'saveAppSettings',settings:{quickFavorites:state.quickFavorites,savedSearches:state.savedSearches,weatherRules:state.weatherRules,ui:{outlookDays:state.outlookDays,logSort:state.logSort}}}).catch(()=>{}),700)}
function saveDraft(){const has=$('#rawText').value.trim()||state.entries.length;if(has){localStorage.setItem('plantDiaryInputDraft',JSON.stringify({inputType:state.inputType,date:$('#inputDate').value,rawText:$('#rawText').value,entries:state.entries}));$('#draftNote').textContent='下書きを保存しました'}else{localStorage.removeItem('plantDiaryInputDraft');$('#draftNote').textContent='入力内容はこの端末に自動保存されます'}}
function clearDraft(){localStorage.removeItem('plantDiaryInputDraft');$('#draftNote').textContent='入力内容はこの端末に自動保存されます'}
function renderQuickInputs(){state.quickMap=new Map();const{favorites:fav,recent}=quickInputRuntime.buildGroups(),group=(label,items)=>items.length?`<div class="quick-label">${label}</div><div class="quick-list">${items.map(x=>{const id=x.qid||`recent:${x.id}`;state.quickMap.set(id,x);return`<button class="quick-chip ${label==='お気に入り'?'favorite-on':''}" data-quick-use="${esc(id)}"><b>${esc(x.action)}</b><span>${esc([x.plantName,x.place,x.pesticide||x.liquidFertilizer||x.material].filter(Boolean).join('・')||'内容を確認')}</span></button>`}).join('')}</div>`:'';$('#quickInputList').innerHTML=group('お気に入り',fav)+group('最近使った内容',recent)||'<div class="quick-empty">実施記録を登録すると、最近使った内容が表示されます</div>';$$('[data-quick-use]').forEach(b=>b.onclick=()=>useQuick(state.quickMap.get(b.dataset.quickUse)))}
function useQuick(x){if(!x)return;const today=localDate(new Date()),q=quickTemplate(x);state.completingPlanId='';state.entries=[{...q,clientId:crypto.randomUUID(),type:'actual',date:today,seasonText:'',planOrder:'通常',scheduleType:'',startDate:'',endDate:'',rotationName:'',rotationOrder:0,cyclic:true,observation:''}];state.inputType='actual';$('#inputDate').value=today;$('#rawText').value='';$$('[data-input-type]').forEach(b=>b.classList.toggle('active',b.dataset.inputType==='actual'));renderPreview();saveDraft();toast('クイック入力を確認画面へ入れました')}
function toggleFavorite(type,id){const x=(type==='plan'?state.plans:state.actuals).find(v=>v.id===id);if(!x)return;const{added}=quickInputRuntime.toggleFavorite(x);toast(added?'クイック入力へ追加しました':'お気に入りから外しました');saveQuickFavorites();renderQuickInputs();renderToday();renderLogs();renderPlans()}
function renderPinned(){const p=state.pinned||{},today=localDate(new Date()),todayWork=(p.workItems||[]).filter(x=>x.date===today||(x.startDate&&x.startDate<=today&&(!x.endDate||x.endDate>=today))),card=(label,x,kind)=>`<div class="pin-card"><small>${label}</small><b>${x?esc((kind==='liquid'?x.liquidFertilizer:x.pesticide)||x.action):'未登録'}</b><span>${x?esc([kind==='spray'&&x.sprayTarget,kind==='spray'&&x.targetPest,x.date?fmtDate(x.date):(x.seasonText||'')].filter(Boolean).join('・')):''}</span></div>`;$('#pinRow').innerHTML=card('次回 消毒',p.sprayNext,'spray')+card('次々回 消毒',p.sprayAfterNext,'spray')+card('次回 液肥',p.liquidNext,'liquid')+card('次々回 液肥',p.liquidAfterNext,'liquid');$('#pinMore').innerHTML=todayWork.map(x=>`<span class="mini-plan">${esc(x.date?fmtDate(x.date):(x.startDate?`${fmtDate(x.startDate)}〜${fmtDate(x.endDate)}`:(x.seasonText||'未定')))}　${esc(x.action)}</span>`).join('')||'<span class="today-work-empty">今日に該当する作業はありません</span>';$('#overdue').innerHTML=p.overdueCount?`<span class="overdue">期限超過 ${p.overdueCount}件</span>`:'';const w=state.weather,wt=w?(w.am&&w.pm&&w.am!==w.pm?`${w.am}→${w.pm}`:(w.am||w.pm||'天気')):'',f=state.forecasts.find(x=>x.date===today)||state.forecasts[0];$('#weather').textContent=w?`${wt}　最高 ${w.maxTemp??'—'}℃／最低 ${w.minTemp??'—'}℃　降水 ${w.rain??'—'}mm`:f?`今日（予報）：${forecastWeatherName(f)}　最高 ${f.maxTemp??'—'}℃／最低 ${f.minTemp??'—'}℃${f.rain==null?'':`　降水 ${f.rain}mm`}${f.maxWind==null?'':`　風 ${Number(f.maxWind).toFixed(1)}m/s`}`:'';const alerts=[];if(w){if((w.rain||0)>=1||/雨/.test(`${w.am||''}${w.pm||''}`))alerts.push('散布作業は降雨状況を確認');if((w.maxTemp||0)>=33)alerts.push('高温時間帯の作業に注意');if((w.wbgt||0)>=28)alerts.push(`暑さ指数 ${w.wbgt}：休憩・水分補給`);if((w.maxWind||0)>=8)alerts.push('強風時の散布を避ける')}$('#weatherAlert').textContent=alerts.join('／')}
function isRotationPlan(x){return rotationRuntime.isRotationPlan(x)}
function rotationCard(){const vm=rotationRuntime.viewModel();if(!vm)return'';const{current,next,after,total,count,done,rows}=vm,summary=x=>esc([x.category,x.action].filter(Boolean).join('：')),kindClass=x=>x.category==='消毒'?'spray':/液肥/.test(x.category)?'liquid':'vital',detail=[current.pesticide&&`薬剤：${current.pesticide}`,current.liquidFertilizer&&`液肥：${current.liquidFertilizer}`,current.dilution].filter(Boolean).join('・');return`<div class="card rotation-card"><div class="rotation-head"><div><div class="pin-title">ダリア用ローテーション</div><div class="log-meta">実施履歴 ${done}回・実施すると自動で次の枠へ進みます</div></div><span class="rotation-count">現在 ${count} / ${total}</span></div><div class="rotation-current"><div class="rotation-label">今回</div><div class="rotation-action">${summary(current)}</div>${detail?`<div class="rotation-detail">${esc(detail)}</div>`:''}</div><div class="rotation-next"><div><div class="rotation-label">次回</div><b>${summary(next)}</b></div><div><div class="rotation-label">次々回</div><b>${summary(after)}</b></div></div><div class="rotation-actions"><button class="primary" data-rotation-run="${current.id}">実施する</button><button class="secondary" data-rotation-skip="${current.id}">今回は飛ばす</button></div><button class="rotation-expand" data-rotation-expand>${state.rotationExpanded?'閉じる':'全12枠を見る'}</button>${state.rotationExpanded?`<div class="rotation-list">${rows.map((x,i)=>`<div class="rotation-row ${i===0?'current':''}"><span class="rotation-no">${i===0?'●':'○'} ${x.rotationOrder}</span><span class="rotation-kind ${kindClass(x)}">${esc(x.category)}</span><span>${esc(x.action)}</span></div>`).join('')}</div>`:''}</div>`}
function renderToday(){const today=localDate(new Date()),actual=state.actuals.filter(x=>x.date===today),plans=state.plans.filter(x=>x.status!=='完了'&&x.status!=='中止'&&(x.date===today||(x.startDate&&x.startDate<=today&&(!x.endDate||x.endDate>=today)))).filter(x=>!isRotationPlan(x)),section=(title,key,items,empty)=>`<div class="card"><button class="section-head" data-section-toggle="${key}"><span>${title}</span><span>${state.collapsed[key]?'＋':'−'}</span></button><div class="section-body ${state.collapsed[key]?'closed':''}">${items.length?items.map(logCard).join(''):`<div class="empty">${empty}</div>`}</div></div>`;$('#todayList').innerHTML=rotationCard()+section('今日の予定','todayPlans',plans,'今日の予定はありません')+section('今日の実施記録','todayActual',actual,'今日の実施記録はありません');bindLogActions()}
function emptyEntry(){return{clientId:crypto.randomUUID(),type:state.inputType,date:$('#inputDate').value,seasonText:'',planOrder:'通常',scheduleType:state.inputType==='plan'?'日付指定':'',startDate:'',endDate:'',plantName:'',place:'',category:'その他',action:'',quantity:'',material:'',pesticide:'',liquidFertilizer:'',dilution:'',sprayTarget:'',targetPest:'',rotationName:'',rotationOrder:0,cyclic:true,observation:'',memo:''}}

$('#searchToggle').onclick=()=>$('#searchCard').classList.toggle('open');
function openEdit(type,id){const x=(type==='plan'?state.plans:state.actuals).find(v=>v.id===id);if(!x)return;openModal('編集',`<label class="label">作業内容</label><textarea id="editAction">${esc(x.action)}</textarea><label class="label">備考</label><input id="editMemo" value="${esc(x.memo||'')}"><button class="primary" id="saveEdit">保存</button>`);$('#saveEdit').onclick=async()=>{busy(true,'保存中…');try{const d=await api({action:'update',type,id,patch:{action:$('#editAction').value,memo:$('#editMemo').value}});applyBootstrap(d);closeModal();toast('更新しました')}catch(e){toast(e.message)}finally{busy(false)}}}
async function removeEntry(type,id){if(!confirm('削除しますか？'))return;busy(true,'削除中…');try{const d=await api({action:'delete',type,id});applyBootstrap(d);toast('削除しました')}catch(e){toast(e.message)}finally{busy(false)}}
function reuseEntry(type,id){const x=(type==='plan'?state.plans:state.actuals).find(v=>v.id===id);if(!x)return;state.entries=[{...x,clientId:crypto.randomUUID(),id:'',type:'actual',date:localDate(new Date()),status:'',calendarEventId:''}];state.inputType='actual';showTab('input');renderPreview();saveDraft()}
function openComplete(id){const x=state.plans.find(v=>v.id===id);if(!x)return;state.completingPlanId=id;state.entries=[{...x,clientId:crypto.randomUUID(),id:'',type:'actual',date:localDate(new Date()),status:'',calendarEventId:''}];state.inputType='actual';showTab('input');renderPreview();saveDraft()}
async function openPostpone(id){const date=prompt('延期後の日付（YYYY-MM-DD）');if(!date)return;busy(true,'延期中…');try{const d=await api({action:'postponePlan',id,date});applyBootstrap(d);toast('延期しました')}catch(e){toast(e.message)}finally{busy(false)}}
async function cancelPlan(id){if(!confirm('見送りにしますか？'))return;busy(true,'更新中…');try{const d=await api({action:'cancelPlan',id});applyBootstrap(d);toast('見送りにしました')}catch(e){toast(e.message)}finally{busy(false)}}
async function syncCalendar(id){busy(true,'カレンダー登録中…');try{const d=await api({action:'calendar',id});applyBootstrap(d);toast('登録しました')}catch(e){toast(e.message)}finally{busy(false)}}
function openRotationExecute(id){openComplete(id)}
async function skipRotation(id){busy(true,'更新中…');try{const d=await api({action:'skipRotation',id});applyBootstrap(d);toast('今回は飛ばしました')}catch(e){toast(e.message)}finally{busy(false)}}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
$('#syncBtn').onclick=bootstrap;$('#pinToggle').onclick=()=>$('#pinned').classList.toggle('open');
function showTab(tab){$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$$('.tab').forEach(x=>x.classList.toggle('active',x.id===`tab-${tab}`));localStorage.setItem('plantDiaryLastTab',tab);renderActiveTab()}
$$('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
async function startApp(){busy(true,'初期化中…');try{await Promise.all([initializeWeatherRuntime(),initializeDownloadRuntime(),initializeClientRuntimes()]);const last=localStorage.getItem('plantDiaryLastTab');if(last)showTab(last);if(savedDraft){$$('[data-input-type]').forEach(b=>b.classList.toggle('active',b.dataset.inputType===state.inputType));renderPreview()}await bootstrap()}finally{busy(false)}}
startApp();
</script>
</body>
</html>
